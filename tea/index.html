<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЧаДао — Чайная церемония</title>
  <meta name="description"
    content="Интерактивный каталог и гид по завариванию китайского чая методом проливов (Гунфу Ча).">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="../logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-black: #000000;
      --card-bg: #0C0D0F;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #A6CE3C;
      --accent-hover: #BBE059;
      --accent-dark: #8FB82E;
      --accent-glow: rgba(166, 206, 60, 0.15);
      --accent-subtle: rgba(166, 206, 60, 0.08);
      --accent-border: rgba(166, 206, 60, 0.22);
      --text-primary: #F5F5F7;
      --text-secondary: #8E8E93;
      --text-tertiary: #5A5D64;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-black);
      background-image:
        radial-gradient(ellipse 70% 45% at 50% 0%, var(--accent-glow) 0%, transparent 70%);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
      animation: fadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo-box {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: var(--accent-subtle);
      border: 1px solid var(--accent-border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      box-shadow: 0 8px 24px rgba(166, 206, 60, 0.12);
      transition: transform 0.3s ease;
    }

    .logo-box:hover {
      transform: scale(1.04);
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      display: block;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      color: var(--text-primary);
    }

    .subtitle {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .tea-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-subtle);
      border: 1px solid var(--accent-border);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 22px;
      word-break: break-all;
    }

    .tea-badge strong {
      color: var(--accent);
      font-weight: 700;
    }

    .status-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      padding: 18px 16px;
      margin-bottom: 22px;
    }

    .status-text {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .progress-bar-container {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 100px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent-dark), var(--accent));
      animation: progress 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: left;
    }

    @keyframes progress {
      0% {
        transform: scaleX(0);
      }

      100% {
        transform: scaleX(1);
      }
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: var(--accent);
      color: #0C0D0F;
      box-shadow: 0 4px 20px rgba(166, 206, 60, 0.25);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(166, 206, 60, 0.35);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-weight: 600;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--accent-border);
      transform: translateY(-1px);
    }

    .footer-note {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 18px;
      line-height: 1.5;
    }

    .domain-alert {
      color: #E5A93C;
      font-weight: 600;
      word-break: break-all;
    }
  </style>
</head>

  <script>
    (function () {
      const fullUrl = window.location.href;
      const urlParams = new URLSearchParams(window.location.search);
      let teaId = urlParams.get('id');
      let rawTargetUrl = urlParams.get('target');

      // 1. Умное восстановление target, если в URL потерялся '?'
      if (!rawTargetUrl) {
        const targetMatch = fullUrl.match(/[?&]target=([^&#]+)/i);
        if (targetMatch) {
          try {
            rawTargetUrl = decodeURIComponent(targetMatch[1]);
          } catch (_) {
            rawTargetUrl = targetMatch[1];
          }
        }
      }

      // 2. Умное восстановление teaId
      if (!teaId) {
        const idMatch = fullUrl.match(/[?&]id=([a-zA-Z0-9_\-]+)/i);
        if (idMatch) {
          teaId = idMatch[1];
        } else {
          // Если ID был передан как часть пути, например: /tea/gaba_woodland&target=...
          const pathMatch = window.location.pathname.match(/\/([a-zA-Z0-9_\-]+)(?:&|$)/);
          if (pathMatch && !['redirect-test', 'web_redirect', 'tea'].includes(pathMatch[1])) {
            teaId = pathMatch[1];
          }
        }
      }

      // 3. Белый список доверенных доменов для авто-редиректа (только официальный магазин)
      const TRUSTED_DOMAINS = [
        'chaekshop.ru'
      ];

      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // 4. Безопасный парсинг и валидация URL (защита от XSS: javascript:, data:, vbscript:)
      function parseSafeUrl(raw) {
        if (!raw || typeof raw !== 'string') return null;
        const trimmed = raw.trim();
        // Строгий запрет псевдо-протоколов выполнения скриптов
        if (/^\s*(javascript|data|vbscript|file):/i.test(trimmed)) {
          return null;
        }
        try {
          const parsed = new URL(trimmed, window.location.origin);
          // Разрешаем только протоколы http и https
          if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') {
            return null;
          }
          return parsed;
        } catch (_) {
          return null;
        }
      }

      // 5. Проверка соответствия белому списку (защита от Open Redirect)
      function isTrustedHost(hostname) {
        if (!hostname) return false;
        const host = hostname.toLowerCase();
        const currentHost = (window.location.hostname || '').toLowerCase();

        // Разрешаем локальное окружение и текущий хост
        if (host === 'localhost' || host === '127.0.0.1') {
          return true;
        }
        if (currentHost && (host === currentHost || host.endsWith('.' + currentHost))) {
          return true;
        }
        return TRUSTED_DOMAINS.some(function (domain) {
          return host === domain || host.endsWith('.' + domain);
        });
      }

      const safeTargetUrl = parseSafeUrl(rawTargetUrl);
      const isTrustedTarget = safeTargetUrl ? isTrustedHost(safeTargetUrl.hostname) : false;

      const teaBadge = document.getElementById('teaBadge');
      const teaIdLabel = document.getElementById('teaIdLabel');
      const statusMessage = document.getElementById('statusMessage');
      const progressBar = document.getElementById('progressBar');
      const targetBtn = document.getElementById('targetBtn');
      const targetBtnText = document.getElementById('targetBtnText');
      const appBtn = document.getElementById('appBtn');
      const footerNote = document.getElementById('footerNote');

      if (teaId) {
        teaBadge.style.display = 'inline-flex';
        teaIdLabel.textContent = teaId;

        // Надежный Android Intent для Chrome + кастомная схема для остальных
        const androidIntentUrl = 'intent://tea?id=' + encodeURIComponent(teaId) + '#Intent;scheme=chadao;package=com.chadao.chadao;end';
        const customSchemeUrl = 'chadao://tea?id=' + encodeURIComponent(teaId);

        const isAndroid = /Android/i.test(navigator.userAgent);
        appBtn.href = isAndroid ? androidIntentUrl : customSchemeUrl;
        appBtn.style.display = 'flex';

        // Мягкая попытка открыть приложение на Android
        if (isAndroid) {
          if (safeTargetUrl && isTrustedTarget) {
            setTimeout(function () {
              window.location.href = safeTargetUrl.href;
            }, 1500);
          }
          // Пробуем вызвать кастомную схему
          window.location.href = customSchemeUrl;
        }
      }

      if (safeTargetUrl) {
        targetBtn.href = safeTargetUrl.href;
        targetBtn.rel = 'noopener noreferrer';
        targetBtn.style.display = 'flex';

        if (isTrustedTarget) {
          // Доверенный домен (Wildberries, Ozon и др.) — безопасный авто-редирект
          if (targetBtnText) targetBtnText.textContent = 'Перейти в магазин';
          statusMessage.textContent = 'Перенаправляем в магазин...';

          setTimeout(function () {
            window.location.href = safeTargetUrl.href;
          }, 1200);
        } else {
          // Внешний недоверенный домен (предотвращение Open Redirect)
          // Авто-редирект отключен: требуем явного подтверждения пользователя
          progressBar.style.display = 'none';
          targetBtn.target = '_blank';
          if (targetBtnText) targetBtnText.textContent = 'Перейти на ' + safeTargetUrl.hostname;
          statusMessage.innerHTML = 'Внешняя ссылка на сторонний ресурс:<br><strong class="domain-alert">' + escapeHtml(safeTargetUrl.hostname) + '</strong>';
          if (footerNote) {
            footerNote.textContent = 'Переход по внешней ссылке выполняется по вашему решению.';
          }
        }
      } else {
        progressBar.style.display = 'none';
        if (rawTargetUrl) {
          // Ссылка была передана, но отфильтрована как небезопасная/некорректная
          statusMessage.textContent = teaId
            ? 'Сорт найден. Небезопасная ссылка для перехода заблокирована.'
            : 'Некорректная или небезопасная ссылка для перехода.';
        } else if (teaId) {
          statusMessage.textContent = 'Сорт найден. Откройте в приложении ЧаДао или перейдите по ссылке.';
        } else {
          statusMessage.textContent = 'Добро пожаловать в ЧаДао — интерактивный каталог китайского чая.';
        }
      }
    })();
  </script>
</body>

</html>
