<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЧаДао — Чайная церемония и таймер</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #12100E;
      --card-bg: rgba(28, 25, 23, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --jade-green: #3E7B5D;
      --jade-light: #52A07B;
      --terracotta: #C26343;
      --text-main: #F5F2EB;
      --text-muted: #9E9589;
      --gold: #D4AF37;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(62, 123, 93, 0.22) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(194, 99, 67, 0.15) 0%, transparent 50%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-badge {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, rgba(62, 123, 93, 0.25), rgba(194, 99, 67, 0.25));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .logo-badge::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 28px;
      border: 1px dashed rgba(82, 160, 123, 0.3);
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #FFF;
    }

    .chinese-title {
      font-family: 'Noto Serif SC', serif;
      color: var(--gold);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 18px;
      opacity: 0.9;
    }

    .tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 100px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 24px;
      word-break: break-all;
    }

    .tag-badge span {
      color: var(--jade-light);
    }

    .status-box {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 18px;
      padding: 20px 16px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .status-text {
      font-size: 15px;
      color: var(--text-main);
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 14px;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--jade-green), var(--terracotta));
      animation: progress 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: left;
    }

    @keyframes progress {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      margin-bottom: 12px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--terracotta), #D37453);
      color: #FFF;
      box-shadow: 0 8px 24px rgba(194, 99, 67, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(194, 99, 67, 0.45);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .footer-note {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-badge">🍵</div>
    <h1>ЧаДао</h1>
    <div class="chinese-title">茶道 · GONGFU TEA TIMER</div>

    <div id="teaBadge" class="tag-badge" style="display: none;">
      Сорт: <span id="teaIdLabel"></span>
    </div>

    <div class="status-box">
      <div id="statusMessage" class="status-text">
        Перенаправляем на страницу чая...
      </div>
      <div class="progress-bar-container" id="progressBar">
        <div class="progress-bar"></div>
      </div>
    </div>

    <a id="targetBtn" href="#" class="btn btn-primary" style="display: none;">
      Перейти на страницу ➔
    </a>

    <a id="appBtn" href="#" class="btn btn-secondary" style="display: none;">
      Открыть в приложении ЧаДао
    </a>

    <p class="footer-note" id="footerNote">
      Если автоматический переход не произошел, нажмите кнопку выше.
    </p>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const teaId = urlParams.get('id');
      const targetUrl = urlParams.get('target');

      const teaBadge = document.getElementById('teaBadge');
      const teaIdLabel = document.getElementById('teaIdLabel');
      const statusMessage = document.getElementById('statusMessage');
      const progressBar = document.getElementById('progressBar');
      const targetBtn = document.getElementById('targetBtn');
      const appBtn = document.getElementById('appBtn');

      if (teaId) {
        teaBadge.style.display = 'inline-flex';
        teaIdLabel.textContent = teaId;

        // Попытка открыть установленное приложение через кастомную схему chadao://
        const appSchemeUrl = 'chadao://tea?id=' + encodeURIComponent(teaId);
        appBtn.href = appSchemeUrl;
        appBtn.style.display = 'block';

        // Мягкая попытка дернуть схему в фоне без блокировки
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = appSchemeUrl;
        document.body.appendChild(iframe);
      }

      if (targetUrl) {
        targetBtn.href = targetUrl;
        targetBtn.style.display = 'block';

        // Редирект на маркетплейс / внешнюю ссылку через 1.2 секунды
        setTimeout(function() {
          window.location.replace(targetUrl);
        }, 1200);
      } else {
        // Если параметр target не указан
        progressBar.style.display = 'none';
        if (teaId) {
          statusMessage.textContent = 'Откройте приложение ЧаДао, чтобы начать чайную церемонию.';
        } else {
          statusMessage.textContent = 'Добро пожаловать в ЧаДао — интерактивный таймер заваривания китайского чая.';
        }
      }
    })();
  </script>
</body>
</html>
